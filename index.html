<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WABI CFDs | ICT & Silver Bullet Specialist</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Outfit',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#020617;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */

.trading-bg{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:-5;
    overflow:hidden;
}

.trading-bg img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.12;
    animation:zoomBg 20s ease-in-out infinite alternate;
}

@keyframes zoomBg{
    0%{
        transform:scale(1);
    }
    100%{
        transform:scale(1.08);
    }
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:
    linear-gradient(to right, rgba(2,6,23,0.96), rgba(2,6,23,0.82)),
    linear-gradient(to top, rgba(2,6,23,1), rgba(2,6,23,0.5));
    top:0;
    left:0;
    z-index:-4;
}

/* FLOATING CANDLES */

.candle{
    position:fixed;
    width:8px;
    background:#00ffae;
    bottom:-200px;
    opacity:0.12;
    border-radius:10px;
    animation:floatCandles linear infinite;
}

.red{
    background:#ff2d55;
}

@keyframes floatCandles{
    0%{
        transform:translateY(0);
    }
    100%{
        transform:translateY(-130vh);
    }
}

/* NAVBAR */

header{
    position:fixed;
    width:100%;
    top:0;
    left:0;
    padding:22px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    backdrop-filter:blur(14px);
    background:rgba(2,6,23,0.7);
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
    font-size:34px;
    font-weight:900;
    color:#00ffae;
}

/* NAV */

nav{
    display:flex;
    gap:35px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:0.4s;
    position:relative;
}

nav a:hover{
    color:#00ffae;
}

.nav-btn{
    padding:14px 28px;
    border-radius:50px;
    background:#00ffae;
    color:black;
    text-decoration:none;
    font-weight:700;
}

/* HAMBURGER */

.menu-toggle{
    width:45px;
    height:45px;
    display:none;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    z-index:1200;
}

.menu-toggle span{
    width:100%;
    height:4px;
    background:#00ffae;
    border-radius:10px;
    transition:0.4s;
}

/* ACTIVE */

.menu-toggle.active span:nth-child(1){
    transform:rotate(45deg) translateY(14px);
}

.menu-toggle.active span:nth-child(2){
    opacity:0;
}

.menu-toggle.active span:nth-child(3){
    transform:rotate(-45deg) translateY(-14px);
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:70px;
    padding:180px 7% 120px;
}

.hero-left{
    flex:1;
}

.badge{
    display:inline-block;
    padding:12px 24px;
    border-radius:50px;
    background:rgba(0,255,174,0.08);
    border:1px solid rgba(0,255,174,0.2);
    color:#00ffae;
    margin-bottom:25px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        box-shadow:0 0 30px rgba(0,255,174,0.5);
    }
}

.hero-left h1{
    font-size:95px;
    line-height:1;
    margin-bottom:25px;
    font-weight:900;
}

.hero-left h1 span{
    color:#00ffae;
    text-shadow:0 0 20px rgba(0,255,174,0.6);
}

.hero-left p{
    color:#c7c7c7;
    line-height:2;
    font-size:18px;
    margin-bottom:40px;
    max-width:700px;
}

.hero-buttons{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    padding:18px 35px;
    border-radius:60px;
    text-decoration:none;
    font-weight:700;
    transition:0.4s;
}

.primary{
    background:#00ffae;
    color:black;
    box-shadow:0 0 35px rgba(0,255,174,0.3);
}

.primary:hover{
    transform:translateY(-5px);
    box-shadow:0 0 55px rgba(0,255,174,0.7);
}

.secondary{
    border:1px solid rgba(255,255,255,0.15);
    color:white;
}

.secondary:hover{
    border-color:#00ffae;
    color:#00ffae;
}

/* WABI IMAGE */

.wabi-image{
    margin-top:40px;
    width:260px;
    height:260px;
    border-radius:50%;
    overflow:hidden;
    border:4px solid #00ffae;
    box-shadow:0 0 50px rgba(0,255,174,0.5);
    animation:wabiFloat 4s ease-in-out infinite;
}

.wabi-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes wabiFloat{
    50%{
        transform:translateY(-15px);
    }
}

/* HERO CARD */

.hero-right{
    width:470px;
}

.chart-card{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:35px;
    padding:35px;
    backdrop-filter:blur(18px);
    box-shadow:0 0 60px rgba(0,0,0,0.4);
}

.card-top{
    display:flex;
    justify-content:space-between;
}

.live{
    color:#00ffae;
    font-weight:700;
}

.price{
    font-size:45px;
    font-weight:900;
    margin-top:25px;
    color:#00ffae;
}

/* MOBILE */

@media(max-width:768px){

    .menu-toggle{
        display:flex;
    }

    nav{
        position:fixed;
        top:90px;
        right:-100%;
        width:280px;
        background:rgba(2,6,23,0.96);
        backdrop-filter:blur(18px);
        flex-direction:column;
        padding:40px;
        border-radius:25px;
        gap:30px;
        transition:0.5s;
        border:1px solid rgba(255,255,255,0.08);
    }

    nav.active{
        right:20px;
    }

    .nav-btn{
        display:none;
    }

    .hero{
        flex-direction:column;
        text-align:center;
    }

    .hero-left h1{
        font-size:48px;
    }

    .hero-buttons{
        justify-content:center;
    }

    .hero-right{
        width:100%;
    }

    .wabi-image{
        margin:auto;
        margin-top:40px;
    }

}

</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="trading-bg">
<img src="https://images.unsplash.com/photo-1642790106117-e829e14a795f?q=80&w=1800&auto=format&fit=crop">
</div>

<div class="overlay"></div>

<!-- FLOATING CANDLES -->

<div class="candle" style="left:5%; height:120px; animation-duration:14s;"></div>
<div class="candle red" style="left:12%; height:90px; animation-duration:10s;"></div>
<div class="candle" style="left:22%; height:160px; animation-duration:18s;"></div>

<!-- NAVBAR -->

<header>

<div class="logo">WABI CFDs</div>

<!-- HAMBURGER -->

<div class="menu-toggle" id="menuToggle">
    <span></span>
    <span></span>
    <span></span>
</div>

<nav id="mobileMenu">
<a href="#home">Home</a>
<a href="#courses">Courses</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</nav>

<a href="#contact" class="nav-btn">Join Now</a>

</header>

<!-- HERO -->

<section class="hero" id="home">

<div class="hero-left">

<div class="badge">
ICT • SILVER BULLET • SMART MONEY
</div>

<h1>
TRADE LIKE<br>
A <span>PRO</span><br>
WITH WABI CFDs
</h1>

<p>
Master ICT Concepts, Silver Bullet Strategy,
Liquidity Sweeps, MSS, FVGs & Institutional Trading.
</p>

<div class="hero-buttons">
<a href="#courses" class="btn primary">Explore Courses</a>
<a href="#contact" class="btn secondary">Contact Us</a>
</div>

<div class="wabi-image">
<img src="wabii.jpeg">
</div>

</div>

<div class="hero-right">

<div class="chart-card">

<div class="card-top">
<h3>Weekly Capture</h3>
<div class="live">● LIVE</div>
</div>

<div class="price">
+1000 PIPS
</div>

</div>

</div>

</section>

<script>

gsap.registerPlugin(ScrollTrigger);

/* HERO ANIMATION */

gsap.from(".hero-left",{
    opacity:0,
    x:-120,
    duration:1.5
});

gsap.from(".hero-right",{
    opacity:0,
    x:120,
    duration:1.5
});

/* MOBILE MENU */

const menuToggle = document.getElementById("menuToggle");
const mobileMenu = document.getElementById("mobileMenu");

menuToggle.addEventListener("click",()=>{

    menuToggle.classList.toggle("active");
    mobileMenu.classList.toggle("active");

});

/* CLOSE MENU */

document.querySelectorAll("#mobileMenu a").forEach(link=>{

    link.addEventListener("click",()=>{

        menuToggle.classList.remove("active");
        mobileMenu.classList.remove("active");

    });

});

</script>

</body>
</html>
